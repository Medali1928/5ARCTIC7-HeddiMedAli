# 1 - ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-config
  namespace: devops
data:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql-service:3306/springdb?useSSL=false&allowPublicKeyRetrieval=true
---
# 2 - Secret (valeurs en base64)
apiVersion: v1
kind: Secret
metadata:
  name: spring-secret
  namespace: devops
type: Opaque
data:
  SPRING_DATASOURCE_USERNAME: c3ByaW5n          # spring
  SPRING_DATASOURCE_PASSWORD: c3ByaW5nMTIz      # spring123
---
# 3 - Deployment Spring Boot
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: heddimedali/backend:1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: spring-config
            - secretRef:
                name: spring-secret
---
# 4 - Service Spring Boot (NodePort)
# Nommé "backend" : le Nginx du frontend redirige /api vers http://backend:8080
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devops
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
  type: NodePort

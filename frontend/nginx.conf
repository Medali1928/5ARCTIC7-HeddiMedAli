server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels /api/... sont redirigés vers le conteneur backend (réseau Docker)
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
    }

    # Routage Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
